<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lighting Challenge</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main id="game">


        <!-- ================= START SCREEN ================= -->

        <section id="start-screen">

            <h1>Lighting Challenge</h1>

            <p>
                Test your knowledge of lighting applications,
                technologies and technical requirements.
            </p>

            <input
                type="text"
                id="player-name"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="name"
            >

            <button id="start-button">
                Start Game
            </button>

        </section>



        <!-- ================= QUIZ SCREEN ================= -->

        <section
            id="quiz-screen"
            class="hidden"
        >

            <div class="top-bar">

                <div>
                    ❤️
                    <span id="lives">❤️ ❤️ ❤️</span>
                </div>

                <div>
                    ⭐
                    <span id="score">0</span>
                </div>

                <div>
                    ⏱️
                    <span id="timer">60</span>s
                </div>

            </div>


            <div class="progress">

                Question
                <span id="question-number">1</span>
                / 12

            </div>


            <h2 id="application"></h2>


            <p id="question"></p>


            <div id="options"></div>


            <p id="feedback"></p>


            <button
                id="next-button"
                class="hidden"
            >
                Next Question
            </button>

        </section>



        <!-- ================= RESULT SCREEN ================= -->

        <section
            id="result-screen"
            class="hidden"
        >

            <h1>
                Game Complete!
            </h1>


            <p id="result-name"></p>


            <h2>
                Score:
                <span id="final-score">0</span>
            </h2>


            <p>
                Correct Answers:
                <span id="correct-count">0 / 12</span>
            </p>


            <p>
                Accuracy:
                <span id="accuracy">0</span>%
            </p>


            <p>
                Time:
                <span id="final-time">0</span>s
            </p>


            <button id="restart-button">
                Play Again
            </button>

        </section>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="questions.js"></script>

    <script src="script.js"></script>


</body>

</html>
